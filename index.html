<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoWealth | Modern Finance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            heading: ['Syne', 'sans-serif']
          },
          colors: {
            dark: {
              900: '#0a0a0a',
              800: '#1a1a1a',
              700: '#2a2a2a'
            },
            primary: {
              500: '#6366f1',
              600: '#4f46e5'
            }
          }
        }
      }
    }
  </script>
  <style>
    [data-lucide] { 
      width: 1.25rem; 
      height: 1.25rem;
    }
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body class="bg-dark-900 text-gray-200 font-sans min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <header class="flex justify-between items-center mb-10">
      <div>
        <h1 class="text-3xl font-heading font-bold bg-gradient-to-r from-primary-500 to-purple-400 bg-clip-text text-transparent">NeoWealth</h1>
        <p class="text-gray-400">Your financial command center</p>
      </div>
      <div class="flex items-center space-x-4">
        <button id="themeToggle" class="p-2 rounded-full hover:bg-dark-700 transition-colors">
          <i data-lucide="sun" class="hidden"></i>
          <i data-lucide="moon"></i>
        </button>
        <div class="relative">
          <img src="https://ui-avatars.com/api/?name=John+Doe&background=4f46e5&color=fff" 
               alt="Profile" class="w-10 h-10 rounded-full cursor-pointer">
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-dark-900"></span>
        </div>
      </div>
    </header>

    <!-- Metrics Grid -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
      <div class="bg-dark-800 p-6 rounded-xl border-l-4 border-primary-500 hover:shadow-lg transition-all">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-400">Portfolio Value</p>
            <h3 class="text-2xl font-bold mt-1">₹1,42,856.45</h3>
          </div>
          <div class="p-2 rounded-lg bg-primary-500/10">
            <i data-lucide="wallet" class="text-primary-500"></i>
          </div>
        </div>
        <div class="mt-4 flex items-center text-green-400">
          <i data-lucide="trending-up" class="mr-1"></i>
          <span>+12.4% (30d)</span>
        </div>
      </div>

      <div class="bg-dark-800 p-6 rounded-xl hover:shadow-lg transition-all">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-400">Annual ROI</p>
            <h3 class="text-2xl font-bold mt-1">18.2%</h3>
          </div>
          <div class="p-2 rounded-lg bg-green-500/10">
            <i data-lucide="bar-chart-2" class="text-green-500"></i>
          </div>
        </div>
        <div class="mt-4 flex items-center text-green-400">
          <span>Outperforming 82% peers</span>
        </div>
      </div>

      <div class="bg-dark-800 p-6 rounded-xl hover:shadow-lg transition-all">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-400">Liquid Assets</p>
            <h3 class="text-2xl font-bold mt-1">₹32,450.00</h3>
          </div>
          <div class="p-2 rounded-lg bg-blue-500/10">
            <i data-lucide="coins" class="text-blue-500"></i>
          </div>
        </div>
        <div class="mt-4 flex items-center text-blue-400">
          <span>Across 3 accounts</span>
        </div>
      </div>

      <div class="bg-dark-800 p-6 rounded-xl hover:shadow-lg transition-all">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-400">Market Sentiment</p>
            <h3 class="text-2xl font-bold mt-1">Bullish</h3>
          </div>
          <div class="p-2 rounded-lg bg-yellow-500/10">
